<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<link rel="stylesheet" href="flags2.css" />
		<title>Flags</title>
	</head>

	<body>

			<!-- Flag of Belgium -->
			<div class="flag belgium"> <!-- Outline around the flag -->

				<div class="black"></div>
				<div class="yellow"></div>
				<div class="red"></div>

			</div>

			
			<!-- Flag of Japan -->
			<div class="flag japan"> <!-- Outline around the flag -->

				<div class="circle"></div>

			</div>


			<!-- Flag of Trinidad and Tobago -->
			<div class="flag trinidad"> <!-- Outline around the flag -->

				<div class="diagonal"></div>

			</div>

	</body>

</html>
